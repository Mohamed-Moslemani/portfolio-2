    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      (function () {
        try {
          // ?theme=light|dark forces a theme for this page view without
          // persisting it, handy for previews and screenshots.
          var forced = new URLSearchParams(location.search).get('theme')
          var stored = localStorage.getItem('jj-theme')
          var theme =
            forced === 'light' || forced === 'dark'
              ? forced
              : stored === 'light' || stored === 'dark'
                ? stored
                : window.matchMedia('(prefers-color-scheme: light)').matches
                  ? 'light'
                  : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          // Scroll reveals and the intro loader hide content until JS
          // moves them. This class is what turns them on, so a page
          // rendered without JS shows everything immediately.
          document.documentElement.classList.add('js')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
