    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />

      name="twitter:description"

    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      (function () {
        try {
          // ?theme=light|dark forces a theme for this page view without
          // persisting it, handy for previews and screenshots.
          var forced = new URLSearchParams(location.search).get('theme')
          var stored = localStorage.getItem('jj-theme')
          var theme =
            forced === 'light' || forced === 'dark'
              ? forced
              : stored === 'light' || stored === 'dark'
                ? stored
                : window.matchMedia('(prefers-color-scheme: light)').matches
                  ? 'light'
                  : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
